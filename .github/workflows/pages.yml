# Tarn · publish the gallery, the sample board and the start page as a static site.
# Manual only (workflow_dispatch). Switch it on at publication time: repository Settings → Pages → Source "GitHub Actions",
# then run this workflow. Nothing here runs on push.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (runtime files, gallery, sample board, start page)
        run: |
          set -eu
          mkdir -p _site
          cp -r css js fonts icons gallery example index.html LICENSE NOTICE VERSION _site/
          touch _site/.nojekyll
          find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
