<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Sample board</title>
  <style>
    .bg { fill: oklch(0.232 0.005 265); stroke: rgba(255,255,255,.09); }
    .fg { stroke: oklch(0.66 0.18 300); }
    @media (prefers-color-scheme: light) { .bg { fill: #fff; stroke: rgba(0,0,0,.10); } .fg { stroke: oklch(0.60 0.18 300); } }
  </style>
  <rect class="bg" x=".5" y=".5" width="31" height="31" rx="7"/>
  <g class="fg" transform="translate(6 6) scale(.8333)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
</svg>
